name: Validate PowerShell package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-powershell-51:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Parse and validate on Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\Validate-Package.ps1
      - name: Scan source for accidental credentials
        shell: powershell
        run: .\scripts\Test-SourceHygiene.ps1
      - name: Build source package
        shell: powershell
        run: .\scripts\Build-Package.ps1
  powershell-7:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Parse and validate on PowerShell 7
        shell: pwsh
        run: ./scripts/Validate-Package.ps1
      - name: Scan source for accidental credentials
        shell: pwsh
        run: ./scripts/Test-SourceHygiene.ps1
